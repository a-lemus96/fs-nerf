services:
  fs-nerf:
    image: fs-nerf:latest
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./src:/workspace/src
      - ./configs:/workspace/configs
      - ./data:/workspace/datasets:ro
      - ./output:/workspace/out
    working_dir: /workspace/src
    stdin_open: true
    tty: true