services:
  fs-nerf:
    image: fs-nerf:latest
    container_name: core
    env_file:
      - path: .env
        required: false
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TORCH_HOME=/models/torch
      - WANDB_DIR=/workspace/output/
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    working_dir: /workspace/src
    stdin_open: true
    tty: true
    
    volumes:
      - type: bind
        source: ./src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./configs
        target: /workspace/configs
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
      - type: bind
        source: ./output
        target: /workspace/output
      - type: bind
        source: ./sweeps
        target: /workspace/sweeps
        read_only: true
      - models:/models

volumes:
  models:
